name: Build
on:
  push:
  # Lets a build be started by hand, from the Actions tab or `gh workflow run`.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: python3 -m unittest discover -s tests

  build:
    needs: test
    runs-on: ubuntu-latest
    # The default token is read-only, which is not enough to attach the
    # firmware to a release.
    permissions:
      contents: write
    strategy:
      # One board failing should not hide the state of the other.
      fail-fast: false
      matrix:
        include:
        - board: RPI_PICO_W
          name: pico_w
        - board: RPI_PICO2_W
          name: pico2_w
    env:
      # Prefixed because make takes variables from the environment, and BUILD
      # is the one MicroPython's own Makefiles use for their output directory.
      PTD_BUILD: micropython/ports/rp2/build-${{ matrix.board }}
      PTD_FIRMWARE: pico_train_display_${{ matrix.name }}.uf2
    steps:
    - uses: actions/checkout@v4
      with:
        path: main
    - name: Checkout MicroPython
      uses: actions/checkout@v4
      with:
        repository: micropython/micropython
        # Pinned so a given tag of this project always produces the same
        # firmware. v1.28.0 is the current release; RP2350, and so the Pico 2
        # W, needs at least v1.26. Bump deliberately.
        ref: refs/tags/v1.28.0
        path: micropython
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi \
          libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
          build-essential
    - name: Build cross-compiler
      run: make -C micropython/mpy-cross
    - name: Get MicroPython submodules
      run: make -C micropython/ports/rp2 BOARD=${{ matrix.board }} submodules
    - name: Build MicroPython with manifest
      run: |
        make -j 4 -C micropython/ports/rp2 BOARD=${{ matrix.board }} \
          FROZEN_MANIFEST=$GITHUB_WORKSPACE/main/manifest.py
    - name: Check the firmware suits the board
      run: |
        filesystem=$(grep -rhom1 'MICROPY_HW_FLASH_STORAGE_BYTES=[0-9]*' \
          "$PTD_BUILD" | head -1 | cut -d= -f2)
        python3 main/tools/check_firmware.py "$PTD_BUILD/firmware.uf2" \
          --board ${{ matrix.board }} \
          --filesystem-bytes "$filesystem" \
          --elf "$PTD_BUILD/firmware.elf"
    - name: Name the firmware after its board
      run: cp "$PTD_BUILD/firmware.uf2" "$PTD_FIRMWARE"
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pico_train_display_${{ matrix.name }}
        path: ${{ env.PTD_FIRMWARE }}
    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: ${{ env.PTD_FIRMWARE }}
