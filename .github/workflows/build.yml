name: Build
on:
  push:
  # Lets a build be started by hand, from the Actions tab or `gh workflow run`.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      # The Makefile is where this lives, so it cannot drift from what you run.
      run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    # The default token is read-only, which is not enough to attach the
    # firmware to a release.
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        # The firmware is named after git describe, which needs the tags and
        # the history. The default checkout has neither.
        fetch-depth: 0
    - name: Install build tools
      run: make firmware-depend
    - name: Build firmware
      # The Makefile is the one description of how this is built, so the same
      # command here builds the same thing on a laptop, incrementally.
      run: make firmware
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: build/*.uf2
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build/*.uf2
