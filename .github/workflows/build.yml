name: Build
on:
  push:
  # Lets a build be started by hand, from the Actions tab or `gh workflow run`.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      # The Makefile is where this lives, so it cannot drift from what you run.
      run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    # The default token is read-only, which is not enough to attach the
    # firmware to a release.
    permissions:
      contents: write
    strategy:
      # One board failing should not hide the state of the other.
      fail-fast: false
      matrix:
        board: [RPI_PICO_W, RPI_PICO2_W]
    steps:
    - uses: actions/checkout@v4
    - name: Install build tools
      run: make firmware-depend
    - name: Build firmware
      # The Makefile is the one description of how this is built, so the same
      # command here builds the same thing on a laptop, incrementally.
      run: make firmware BOARD=${{ matrix.board }}
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pico_train_display_${{ matrix.board }}
        path: build/pico_train_display_${{ matrix.board }}.uf2
    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: build/pico_train_display_${{ matrix.board }}.uf2
